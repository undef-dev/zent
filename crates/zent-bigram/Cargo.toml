[package]
name = "zent-bigram"
version = "0.2.0"
description = "A character-level bigram language model and CLI"
edition = "2024"
license-file = "../../LICENSE.md"
repository = "https://github.com/undef-dev/zent"
default-run = "zent"

[lib]
name = "zent_bigram"
path = "src/lib.rs"

[[bin]]
name = "zent"
path = "src/main.rs"

[dependencies]
zent-random = { version = "0.1.0", path = "../zent-random" }
